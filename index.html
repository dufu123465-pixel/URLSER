<style>

    --accent: #4f6ef2;
    --shadow: 0 1px 3px rgba(17, 24, 39, .08);

    --chip-hover: rgba(79, 110, 242, .08);
  }
  body.dark {
    --bg: #0f1420;
    --card: #171e2e;
    --text: #e5e9f2;
    --muted: #8b93a7;
    --line: #262f45;
    --shadow: 0 1px 3px rgba(0, 0, 0, .4);
    --shadow-hover: 0 10px 24px rgba(0, 0, 0, .5);
    --chip-bg: rgba(15, 20, 32, .85);
    --chip-hover: rgba(79, 110, 242, .18);
  }
  body {
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background .25s, color .25s;
  }
  #themeBtn {
    position: fixed; top: 14px; right: 16px; z-index: 60;
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--card);
    cursor: pointer; font-size: 17px; box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: center;
  }
  header { text-align: center; padding: 46px 16px 8px; }
  header h1 {
    font-size: 34px; letter-spacing: 1px;
    background: linear-gradient(90deg, #4f6ef2, #9b5cf6, #22c1dc);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  header .sub { margin-top: 8px; font-size: 14px; color: var(--muted); }
  .search-wrap { position: relative; max-width: 660px; margin: 26px auto 10px; }
  .search-wrap svg {
    position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
    width: 19px; height: 19px; color: var(--muted); pointer-events: none;
  }
  #q {
    width: 100%; font-size: 15.5px; color: var(--text);
    padding: 15px 46px 15px 48px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card);
    box-shadow: var(--shadow); outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  #q::placeholder { color: var(--muted); }
  #q:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(79, 110, 242, .15); }
  #clearBtn {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px; border-radius: 50%; border: none;
    background: var(--line); color: var(--muted); font-size: 14px;
    cursor: pointer; display: none; line-height: 1;
  }
  #clearBtn.show { display: block; }
  #stats { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  #chips {
    position: sticky; top: 0; z-index: 50;
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    padding: 12px 16px; background: var(--chip-bg);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .chip {
    padding: 7px 14px; border-radius: 999px; font-size: 13px;
    border: 1px solid var(--line); background: var(--card);
    color: var(--text); cursor: pointer; transition: all .15s;
  }
  .chip:hover { background: var(--chip-hover); }
  .chip.active {
    background: linear-gradient(90deg, #4f6ef2, #6a5cf6);
    color: #fff; border-color: transparent;
  }
  main { max-width: 1200px; margin: 0 auto; padding: 6px 20px 30px; }
  section { margin-top: 28px; }
  section h2 { display: flex; align-items: center; gap: 8px; font-size: 17px; margin-bottom: 14px; }
  section h2 .cnt {
    font-size: 12px; font-weight: 400; color: var(--muted);
    background: var(--chip-hover); padding: 1px 9px; border-radius: 999px;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 13px; }
  .card {
    display: flex; flex-direction: column; gap: 10px; padding: 15px 16px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    cursor: pointer; transition: transform .18s, box-shadow .18s, border-color .18s;
  }
  .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); border-color: #b9c6fb; }
  body.dark .card:hover { border-color: #3b4a6e; }
  .card .top { display: flex; align-items: center; gap: 12px; }
  .avatar {
    position: relative; overflow: hidden; flex: none;
    width: 44px; height: 44px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 18px; user-select: none;
  }
  .avatar img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: 0; transition: opacity .2s; background: #fff;
  }
  .avatar img.on { opacity: 1; }
  .meta { min-width: 0; }
  .name { font-size: 15px; font-weight: 600; }
  .desc {
    font-size: 12.5px; color: var(--muted); margin-top: 3px; line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .urlbtn {
    align-self: flex-start; font-size: 12px; color: var(--accent);
    background: transparent; border: 1px dashed transparent; border-radius: 6px;
    padding: 1px 6px; margin-left: -6px; cursor: copy; font-family: inherit;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .urlbtn:hover { background: var(--chip-hover); border-color: var(--accent); }
  mark { background: rgba(255, 200, 0, .45); color: inherit; border-radius: 3px; padding: 0 1px; }
  .empty { display: none; text-align: center; padding: 80px 16px; color: var(--muted); }
  .empty.show { display: block; }
  .empty .big { font-size: 46px; margin-bottom: 12px; }
  .empty p { font-size: 14px; margin-bottom: 18px; }
  .empty button {
    padding: 9px 22px; border-radius: 999px; border: none; cursor: pointer;
    background: linear-gradient(90deg, #4f6ef2, #6a5cf6); color: #fff; font-size: 14px;
  }
  #toast {
    position: fixed; left: 50%; bottom: 32px; z-index: 99;
    transform: translateX(-50%) translateY(20px); opacity: 0;
    background: #111827; color: #fff; font-size: 13px;
    padding: 9px 18px; border-radius: 999px; pointer-events: none;
    transition: all .25s; max-width: 80vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  footer { padding: 26px 16px 42px; text-align: center; color: var(--muted); font-size: 12.5px; line-height: 1.9; }
  @media (max-width: 560px) {
    header { padding-top: 34px; }
    header h1 { font-size: 26px; }
    main { padding: 6px 12px 20px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  }
</style>

<button id="themeBtn" title="切换深色/浅色模式">🌙</button>

<header>

  </div>
  <div id="stats"></div>
</header>

<nav id="chips"></nav>

<main id="root"></main>

<div id="empty" class="empty">
  <div class="big">🔍</div>
  <p>没有找到相关网站，试试其他关键词，或换个分类看看</p>

</div>

<footer>

</footer>

<div id="toast"></div>

const PALETTE = ['#6366f1', '#8b5cf6', '#ec4899', '#f43f5e', '#f97316', '#f59e0b',
  '#10b981', '#06b6d4', '#3b82f6', '#84cc16', '#14b8a6', '#a855f7'];

const qInput = document.getElementById('q');
const clearBtn = document.getElementById('clearBtn');
const chipsEl = document.getElementById('chips');
const rootEl = document.getElementById('root');
const emptyEl = document.getElementById('empty');
const statsEl = document.getElementById('stats');
const toastEl = document.getElementById('toast');
const themeBtn = document.getElementById('themeBtn');

let query = '';
let cat = '全部';
let lastMatches = [];
let toastTimer = null;

function esc(t) {
  return String(t).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
}
function hostOf(u) {
  try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; }
}
function colorOf(name) {
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return PALETTE[h % PALETTE.length];
}
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
}
function copyText(text) {
  const done = () => toast('已复制：' + text);
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('复制失败，请手动复制'); }
    ta.remove();
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, fallback);
  } else fallback();
}

function getTokens() {
  return query.trim().toLowerCase().split(/\s+/).filter(Boolean);
}
function matchSite(s, tokens) {
  if (!tokens.length) return true;
  const hay = (s[0] + ' ' + s[1] + ' ' + s[2] + ' ' + (s[4] || '') + ' ' + s[3]).toLowerCase();
  return tokens.every(t => hay.includes(t));
}

function render() {
  const tokens = getTokens();
  lastMatches = SITES.filter(s => (cat === '全部' || s[3] === cat) && matchSite(s, tokens));

  const reFor = t => new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  const hl = t => {
    t = esc(t);
    for (const tk of tokens) t = t.replace(reFor(tk), m => '<mark>' + m + '</mark>');
    return t;
  };

  let html = '';
  let shown = 0;
  for (const [cname, icon] of CATS) {
    const items = lastMatches.filter(s => s[3] === cname);
    if (!items.length) continue;
    shown += items.length;
    html += '<section><h2><span>' + icon + '</span>' + esc(cname) +
      '<span class="cnt">' + items.length + '</span></h2><div class="grid">';
    for (const s of items) {
      const [n, u, d] = s;
      const host = hostOf(u);
      const fav = 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(host) + '&sz=64';
      html += '<div class="card" data-url="' + esc(u) + '">' +
        '<div class="top">' +
        '<span class="avatar" style="background:' + colorOf(n) + '">' + esc((n[0] || '?').toUpperCase()) +
        '<img src="' + fav + '" alt="" loading="lazy" onload="this.classList.add(\'on\')" onerror="this.remove()"></span>' +
        '<div class="meta"><div class="name">' + hl(n) + '</div><div class="desc">' + hl(d) + '</div></div></div>' +
        '<button class="urlbtn" data-url="' + esc(u) + '" title="点击复制链接">⧉ ' + esc(host) + '</button>' +
        '</div>';
    }
    html += '</div></section>';
  }
  rootEl.innerHTML = html;

  if (lastMatches.length > 0 && shown === 0) shown = lastMatches.length; // 数据一致性兜底
  emptyEl.classList.toggle('show', shown === 0);
  statsEl.textContent = (query || cat !== '全部')
    ? '匹配到 ' + shown + ' 个网站'
    : '共收录 ' + SITES.length + ' 个网站 · ' + CATS.length + ' 个分类';
}

function renderChips() {
  let html = '<button class="chip' + (cat === '全部' ? ' active' : '') + '" data-cat="全部">全部</button>';
  for (const [cname, icon] of CATS) {
    html += '<button class="chip' + (cat === cname ? ' active' : '') + '" data-cat="' + esc(cname) + '">' +
      icon + ' ' + esc(cname) + '</button>';
  }
  chipsEl.innerHTML = html;
}

function setQuery(v) {
  query = v;
  qInput.value = v;
  clearBtn.classList.toggle('show', !!v);
  render();
}

qInput.addEventListener('input', () => setQuery(qInput.value));
qInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (lastMatches.length) window.open(lastMatches[0][1], '_blank', 'noopener');
  } else if (e.key === 'Escape') {
    setQuery('');
    qInput.blur();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== qInput) {
    e.preventDefault();
    qInput.focus();
  }
});

clearBtn.addEventListener('click', () => { setQuery(''); qInput.focus(); });
document.getElementById('resetBtn').addEventListener('click', () => { cat = '全部'; renderChips(); setQuery(''); });

chipsEl.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  cat = chip.dataset.cat;
  renderChips();
  render();
});

rootEl.addEventListener('click', e => {
  const btn = e.target.closest('.urlbtn');
  if (btn) { e.stopPropagation(); copyText(btn.dataset.url); return; }
  const card = e.target.closest('.card');
  if (card) window.open(card.dataset.url, '_blank', 'noopener');
});

function applyTheme(dark) {
  document.body.classList.toggle('dark', dark);
  themeBtn.textContent = dark ? '☀️' : '🌙';
  try { localStorage.setItem('nav-theme', dark ? 'dark' : 'light'); } catch (e) {}
}
themeBtn.addEventListener('click', () => applyTheme(!document.body.classList.contains('dark')));
let savedTheme = null;
try { savedTheme = localStorage.getItem('nav-theme'); } catch (e) {}
applyTheme(savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches);

renderChips();
render();
</script>
</body>
</html>
